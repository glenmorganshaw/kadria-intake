<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kadria Character Intake</title>
<style>
  :root { --bg: #f6f4ef; --fg: #1d1b16; --muted: #6b665b; --accent: #7a3b1e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17150f; --fg: #efeadc; --muted: #a39d8c; --accent: #e0a070; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  iframe { flex: 1 1 auto; width: 100%; border: 0; background: var(--bg); }
  #help { display: none; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--muted); }
  #help.show { display: block; }
  #help p { margin: 0 0 6px; }
  #help a { color: var(--accent); word-break: break-all; }
  noscript { padding: 16px; }
</style>
</head>
<body>
<iframe id="form" title="Kadria Character Intake" src="https://script.google.com/macros/s/AKfycbzpd3dobDjH70Nr9mHKBIlrtUE4HSW8I_rW_se_s5PjX8dCxyCIkCug1UN9M00vhadi/exec" allow="clipboard-write"></iframe>
<div id="help" role="status">
  <p>The form is taking a while to load.</p>
  <p>Check your connection and reload this page. If it still does not appear, open the form directly: press and hold
     <a href="https://script.google.com/macros/s/AKfycbzpd3dobDjH70Nr9mHKBIlrtUE4HSW8I_rW_se_s5PjX8dCxyCIkCug1UN9M00vhadi/exec" target="_blank" rel="noopener">this link</a>
     and choose <strong>Open in Safari</strong>.</p>
</div>
<noscript><p>This page needs JavaScript to show the character form.</p></noscript>
<script>
  // A frame that blocks or fails to load cannot be detected across origins, so only a missing "load" within a while shows the help text.
  var f = document.getElementById("form"), help = document.getElementById("help"), loaded = false;
  f.addEventListener("load", function () { loaded = true; help.classList.remove("show"); });
  setTimeout(function () { if (!loaded) help.classList.add("show"); }, 12000);
</script>
</body>
</html>
